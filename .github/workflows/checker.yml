name: Karmelita Jegyfigyelő

on:
  schedule:
    # 15 percenként lefut (Cron formátum)
    - cron: '*/59 * * * *'
  workflow_dispatch: # Manuálisan is elindítható a GitHub felületéről

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          pip install playwright
          playwright install chromium

      - name: Script futtatása
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_karmelita.py
